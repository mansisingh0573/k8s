
# Kubernetes API version
apiVersion: apps/v1

# Resource type
kind: Deployment

# Deployment details
metadata:
  name: nginx-deployment

# Desired configuration
spec:
  replicas: 3  # Create 3 Pods

  # Select Pods using this label
  selector:
    matchLabels:
      app: nginx

  # Pod configuration
  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx-container
          image: nginx:latest  # Docker image
          ports:
            - containerPort: 91  # Application port
